<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Buddy Drop</title>
    <link rel="stylesheet" href="buddy signup.css" />
  </head>
  <body>
    <div class="header">
      <h2>Sign up</h2>
    </div>
    <p id="error" style="color: red"></p>
    <p id="success" style="color: green"></p>
    <div class="signup-container">
      <form id="signupform">
        <name class="name">First Name <span>*</span></name>
        <input type="text" id="firstName" name="text" />
        <br /><br />
        <name class="name">Last Name <span>*</span></name>
        <input type="text" id="lastName" name="text" />
        <br /><br />
        <name class="name">Email <span>*</span></name>
        <input type="email" id="email" name="email" />
        <br /><br />
        <name class="name">Password <span>*</span></name>
        <div class="password">
          <input
            type="password"
            id="passWord"
            name="password"
            placeholder="destiny"
          />
          <img
            id="icon"
            src="/images/eye-icon.png"
            width="20px"
            onclick="togglePassword()"
          />
        </div>
        <br /><br />
        <name class="name">Phone number <span>*</span></name>
        <div class="phoneNumber">
          <input
            type="number"
            id="phoneNumber"
            name="password"
            placeholder="destiny"
          />
        </div>
        <button id="submit-btn" type="submit" class="submit">Sign up</button>
      </form>

      <hr />
      <p class="Or">Or Sign up with</p>

      <div class="logos">
        <img class="logo" src="/images/apple.png" width="15px" height="15px" />
        <img class="logo google" src="/images/google.png" width="15px" />
        <img
          class="logo twitter"
          src="/images/X-Logo.png"
          width="18px"
          height="15px"
        />
      </div>
      <br /><br />
      <div class="last">
        <pp>Already have an account? <a href="buddy login.html">Log in</a></pp>
      </div>
    </div>
  </body>
  <script src="js/signup.js"></script>
</html>
